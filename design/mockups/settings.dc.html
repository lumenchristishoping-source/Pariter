<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
  :root{
    --bg:#09090b;
    --border:rgba(255,255,255,0.07);
    --text:#EDEAE2;
    --text-dim:#9A9A9E;
    --text-faint:#6C6C71;
    --gold:#CCBA78;
    --gold-soft:rgba(204,186,120,0.22);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  .hand{font-family:'Caveat',cursive;}
  .screen{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;color:var(--text);}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;}
  .glow-top{width:280px;height:280px;background:rgba(255,255,255,0.05);top:-120px;left:-40px;}
  .glow-bottom{width:320px;height:320px;background:rgba(204,186,120,0.06);bottom:-140px;right:-60px;}

  .topbar{position:relative;z-index:2;padding:22px 16px 4px;flex-shrink:0;}
  .h1{font-size:24px;font-weight:700;letter-spacing:-0.02em;position:relative;display:inline-block;}
  .squiggle{position:absolute;left:0;bottom:-6px;width:64px;height:8px;}
  .tagline{font-size:20px;color:var(--gold);margin-top:14px;}

  .content{position:relative;z-index:1;flex:1;overflow-y:auto;padding:14px 16px 100px;}
  .section-title{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);margin:20px 6px 8px;}
  .row{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid var(--border);}
  .row-icon{width:32px;height:32px;border-radius:10px;background:rgba(204,186,120,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .row-label{flex:1;font-size:14.5px;font-weight:500;}

  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;background:rgba(10,10,12,0.9);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:10px 0 20px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--text-faint);}
  .tab.active{color:var(--gold);}
</style>
</helmet>
<div class="screen">
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <div class="topbar">
    <div class="h1">Settings
      <svg class="squiggle" viewBox="0 0 64 8" fill="none"><path d="M2 5c8-6 14 3 20-2s14 3 20-2 12 3 20-2" stroke="#CCBA78" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="tagline hand">made for you &amp; yours</div>
  </div>

  <div class="content">
    <div class="section-title">Account</div>
    <div class="row">
      <div class="row-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#CCBA78" stroke-width="1.7"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke="#CCBA78" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div class="row-label">Profile</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#6C6C71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="row">
      <div class="row-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17 8a5 5 0 10-9.5 2.2M4 20a6 6 0 0112 0" stroke="#CCBA78" stroke-width="1.7" stroke-linecap="round"/><circle cx="17" cy="8" r="1.4" fill="#CCBA78"/></svg></div>
      <div class="row-label">Connected people</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#6C6C71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="row">
      <div class="row-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="5" width="14" height="14" rx="4" stroke="#CCBA78" stroke-width="1.7"/><circle cx="9.5" cy="10.5" r="1.2" fill="#CCBA78"/><circle cx="14.5" cy="10.5" r="1.2" fill="#CCBA78"/><path d="M9 14.5c1 1 5 1 6 0" stroke="#CCBA78" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      <div class="row-label">Your agents</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#6C6C71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="section-title">Preferences</div>
    <div class="row">
      <div class="row-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 000 12 6 6 0 000-12z" stroke="#CCBA78" stroke-width="1.7"/><path d="M6 20c1-3 5-4 6-4s5 1 6 4" stroke="#CCBA78" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div class="row-label">Notifications</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#6C6C71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="row">
      <div class="row-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="#CCBA78" stroke-width="1.7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="#CCBA78" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div class="row-label">Appearance</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#6C6C71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="row">
      <div class="row-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z" stroke="#CCBA78" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
      <div class="row-label">Privacy &amp; data</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#6C6C71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="section-title">About</div>
    <div class="row">
      <div class="row-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#CCBA78" stroke-width="1.7"/><path d="M12 11v5M12 8v.5" stroke="#CCBA78" stroke-width="1.9" stroke-linecap="round"/></svg></div>
      <div class="row-label">About Pariter</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#6C6C71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5V20a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-8.5z" stroke="#6C6C71" stroke-width="1.7" stroke-linejoin="round"/></svg>
      Rooms
    </div>
    <div class="tab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#6C6C71" stroke-width="1.7"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke="#6C6C71" stroke-width="1.7" stroke-linecap="round"/></svg>
      Contacts
    </div>
    <div class="tab active">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="#CCBA78" stroke-width="1.7"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="#CCBA78" stroke-width="1.7" stroke-linecap="round"/></svg>
      Settings
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
