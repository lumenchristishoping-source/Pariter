<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
  :root{
    --bg:#09090b;
    --border:rgba(255,255,255,0.07);
    --text:#EDEAE2;
    --text-dim:#9A9A9E;
    --text-faint:#6C6C71;
    --gold:#CCBA78;
    --gold-soft:rgba(204,186,120,0.22);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  a{color:var(--gold);}
  a:hover{color:#E4D9A8;}
  .hand{font-family:'Caveat',cursive;}
  .screen{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;color:var(--text);}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;}
  .glow-top{width:280px;height:280px;background:rgba(255,255,255,0.05);top:-120px;left:-40px;}
  .glow-bottom{width:320px;height:320px;background:rgba(204,186,120,0.06);bottom:-100px;right:-70px;}

  .topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px;flex-shrink:0;}
  .greeting{font-size:18px;color:var(--gold);line-height:1;}
  .h1{font-size:24px;font-weight:700;letter-spacing:-0.02em;position:relative;display:inline-block;margin-top:2px;}
  .squiggle{position:absolute;left:0;bottom:-6px;width:64px;height:8px;}
  .icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--border);flex-shrink:0;}

  .search{
    position:relative;z-index:2;margin:16px 16px 6px;padding:10px 16px;border-radius:999px;
    background:rgba(255,255,255,0.045);border:1px solid var(--border);
    display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:13.5px;
  }

  .list{position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;padding:8px 8px 100px;}
  .room{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid var(--border);}
  .stack{position:relative;width:44px;height:36px;flex-shrink:0;}
  .stack .av{position:absolute;top:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:2px solid var(--bg);}
  .stack .av.ring{border-color:var(--gold);}
  .room-main{flex:1;min-width:0;}
  .room-top{display:flex;justify-content:space-between;align-items:baseline;}
  .room-name{font-size:15px;font-weight:600;}
  .room-time{font-size:11px;color:var(--text-faint);}
  .room-preview{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .unread{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);flex-shrink:0;margin-left:8px;}

  .fab{
    position:absolute;right:18px;bottom:92px;z-index:3;width:52px;height:52px;border-radius:50%;
    background:var(--gold);display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(204,186,120,0.4);
  }

  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;background:rgba(10,10,12,0.9);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:10px 0 20px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--text-faint);}
  .tab.active{color:var(--gold);}
</style>
</helmet>
<div class="screen">
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <div class="topbar">
    <div>
      <div class="greeting hand">good evening</div>
      <div class="h1">Rooms
        <svg class="squiggle" viewBox="0 0 64 8" fill="none"><path d="M2 5c8-6 14 3 20-2s14 3 20-2 12 3 20-2" stroke="#CCBA78" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="icon-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#CCBA78" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="#CCBA78" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6C6C71" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="#6C6C71" stroke-width="1.8" stroke-linecap="round"/></svg>
    Search rooms and people&hellip;
  </div>

  <div class="list">
    <div class="room">
      <div class="stack">
        <div class="av" style="left:0;background:#2A2B30;">A</div>
        <div class="av ring" style="left:18px;background:#1E1F23;">S</div>
      </div>
      <div class="room-main">
        <div class="room-top"><div class="room-name">Design Sprint</div><div class="room-time">2m</div></div>
        <div class="room-preview">Solace: pulling the cohort numbers now&hellip;</div>
      </div>
      <div class="unread"></div>
    </div>

    <div class="room">
      <div class="stack">
        <div class="av" style="left:0;background:#3A2E22;">M</div>
        <div class="av" style="left:18px;background:#26272B;">D</div>
      </div>
      <div class="room-main">
        <div class="room-top"><div class="room-name">Family</div><div class="room-time">1h</div></div>
        <div class="room-preview">Dad: see you all Sunday!</div>
      </div>
    </div>

    <div class="room">
      <div class="stack">
        <div class="av ring" style="left:0;background:#232428;">V</div>
        <div class="av" style="left:18px;background:#2A2B30;">Y</div>
      </div>
      <div class="room-main">
        <div class="room-top"><div class="room-name">Weekend Trip</div><div class="room-time">Yesterday</div></div>
        <div class="room-preview">Vega: I found three cabins under budget</div>
      </div>
    </div>

    <div class="room">
      <div class="stack">
        <div class="av" style="left:0;background:#1E1F23;">S</div>
      </div>
      <div class="room-main">
        <div class="room-top"><div class="room-name">Solace</div><div class="room-time">2d</div></div>
        <div class="room-preview">You: thanks for the recap!</div>
      </div>
    </div>
  </div>

  <div class="fab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#0B0A08" stroke-width="2.4" stroke-linecap="round"/></svg>
  </div>

  <div class="tabbar">
    <div class="tab active">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5V20a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-8.5z" stroke="#CCBA78" stroke-width="1.7" stroke-linejoin="round"/></svg>
      Rooms
    </div>
    <div class="tab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#6C6C71" stroke-width="1.7"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke="#6C6C71" stroke-width="1.7" stroke-linecap="round"/></svg>
      Contacts
    </div>
    <div class="tab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="#6C6C71" stroke-width="1.7"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="#6C6C71" stroke-width="1.7" stroke-linecap="round"/></svg>
      Settings
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
