<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
  :root{
    --bg:#09090b;
    --border:rgba(255,255,255,0.07);
    --text:#EDEAE2;
    --text-dim:#9A9A9E;
    --text-faint:#6C6C71;
    --gold:#CCBA78;
    --gold-soft:rgba(204,186,120,0.22);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  a{color:var(--gold);}
  a:hover{color:#E4D9A8;}
  .hand{font-family:'Caveat',cursive;}
  .screen{
    position:relative;width:390px;height:844px;
    background:var(--bg);overflow:hidden;
    display:flex;flex-direction:column;color:var(--text);
  }
  .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;}
  .glow-top{width:280px;height:280px;background:rgba(255,255,255,0.05);top:-120px;left:-40px;}
  .glow-bottom{width:320px;height:320px;background:rgba(204,186,120,0.07);bottom:-140px;right:-60px;}

  .topbar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:18px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--border);flex-shrink:0;}
  .title{font-size:16px;font-weight:600;letter-spacing:-0.01em;}

  .body{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;position:relative;z-index:1;}
  .hand-caption{font-size:26px;color:var(--gold);}

  .qr-wrap{position:relative;width:220px;height:220px;}
  .qr-card{
    width:100%;height:100%;border-radius:20px;background:#111114;
    border:1px solid var(--border);
    display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);
    gap:6px;padding:22px;
  }
  .qr-card i{background:var(--text);border-radius:2px;opacity:0.9;}
  .bracket{position:absolute;width:28px;height:28px;border-color:var(--gold);}
  .bracket.tl{top:-8px;left:-8px;border-top:3px solid;border-left:3px solid;border-radius:8px 0 0 0;}
  .bracket.tr{top:-8px;right:-8px;border-top:3px solid;border-right:3px solid;border-radius:0 8px 0 0;}
  .bracket.bl{bottom:-8px;left:-8px;border-bottom:3px solid;border-left:3px solid;border-radius:0 0 0 8px;}
  .bracket.br{bottom:-8px;right:-8px;border-bottom:3px solid;border-right:3px solid;border-radius:0 0 8px 0;}

  .arrow-note{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
  .arrow-note .hand{font-size:20px;color:var(--text-dim);}

  .divider-row{display:flex;align-items:center;gap:10px;width:100%;max-width:260px;color:var(--text-faint);font-size:12px;}
  .divider-row .line{flex:1;height:1px;background:var(--border);}

  .btn-ghost{
    padding:12px 28px;border-radius:999px;border:1px solid rgba(204,186,120,0.4);
    color:var(--gold);font-size:14px;font-weight:600;background:transparent;
  }
  .footnote{position:relative;z-index:1;text-align:center;font-size:11.5px;color:var(--text-faint);padding:0 40px 28px;}
</style>
</helmet>
<div class="screen">
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <div class="topbar">
    <div class="icon-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#CCBA78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="title">Connect</div>
  </div>

  <div class="body">
    <div class="hand-caption hand">scan to connect</div>

    <div class="qr-wrap">
      <div class="qr-card">
        <i style="grid-column:1/3;grid-row:1/3;"></i><i></i><i></i><i style="grid-column:6/8;grid-row:1/3;"></i>
        <i></i><i style="opacity:0.15"></i><i></i><i></i><i style="opacity:0.15"></i>
        <i style="grid-column:1/3;grid-row:4/6;"></i><i></i><i></i><i style="grid-column:6/8;grid-row:4/6;"></i>
        <i></i><i style="opacity:0.15"></i><i></i><i></i><i></i>
        <i style="grid-column:1/3;grid-row:6/8;"></i><i></i><i style="opacity:0.15"></i><i></i><i style="grid-column:6/8;"></i>
      </div>
      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
    </div>

    <div class="arrow-note">
      <svg width="30" height="22" viewBox="0 0 30 22" fill="none"><path d="M2 4c6 2 10 8 8 16M10 20l-8 0M10 20l-2-8" stroke="#9A9A9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="hand">point your camera here</span>
    </div>

    <div class="divider-row"><div class="line"></div><span>or</span><div class="line"></div></div>

    <div class="btn-ghost">Share link instead</div>
  </div>

  <div class="footnote">Nobody sees this connection but you two.</div>
</div>
</x-dc>
</body>
</html>
