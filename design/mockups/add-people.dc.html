<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
  :root{
    --bg:#09090b;
    --border:rgba(255,255,255,0.07);
    --text:#EDEAE2;
    --text-dim:#9A9A9E;
    --text-faint:#6C6C71;
    --gold:#CCBA78;
    --gold-soft:rgba(204,186,120,0.22);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  a{color:var(--gold);}
  a:hover{color:#E4D9A8;}
  .hand{font-family:'Caveat',cursive;}
  .screen{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;color:var(--text);}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;}
  .glow-top{width:280px;height:280px;background:rgba(255,255,255,0.05);top:-120px;left:-40px;}
  .glow-bottom{width:320px;height:320px;background:rgba(204,186,120,0.06);bottom:-140px;right:-60px;}

  .topbar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:18px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--border);flex-shrink:0;}
  .title{font-size:16px;font-weight:600;letter-spacing:-0.01em;}

  .name-field{
    position:relative;z-index:1;margin:16px 16px 4px;padding:12px 16px;border-radius:16px;
    background:rgba(255,255,255,0.03);border:1px solid var(--border);
    font-size:15px;color:var(--text-dim);
  }

  .content{position:relative;z-index:1;flex:1;overflow-y:auto;padding:8px 16px 24px;}
  .section-label{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px;}
  .section-label .hand{font-size:20px;color:var(--gold);}
  .section-count{font-size:11px;color:var(--text-faint);}

  .person{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--border);}
  .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0;}
  .p-main{flex:1;min-width:0;}
  .p-name{font-size:14.5px;font-weight:600;}
  .p-sub{font-size:12px;color:var(--text-dim);margin-top:1px;}
  .toggle{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .toggle.on{border-color:var(--gold);background:var(--gold);}

  .dock{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 16px 22px;background:linear-gradient(180deg, rgba(9,9,11,0) 0%, rgba(9,9,11,0.9) 40%, rgba(9,9,11,1) 70%);}
  .btn-create{
    padding:15px;border-radius:999px;background:var(--gold);color:#0B0A08;
    text-align:center;font-size:14.5px;font-weight:700;
    box-shadow:0 10px 30px rgba(204,186,120,0.35);
  }
</style>
</helmet>
<div class="screen">
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <div class="topbar">
    <div class="icon-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#CCBA78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="title">New room</div>
  </div>

  <div class="name-field">Name this room&hellip;</div>

  <div class="content">
    <div class="section-label"><span class="hand">pick your people</span><span class="section-count">2 connected</span></div>
    <div class="person">
      <div class="av" style="background:#3A2E22;">M</div>
      <div class="p-main"><div class="p-name">Mum</div><div class="p-sub">Connected Tuesday</div></div>
      <div class="toggle on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#0B0A08" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="person">
      <div class="av" style="background:#26272B;">D</div>
      <div class="p-main"><div class="p-name">Dara</div><div class="p-sub">Connected last week</div></div>
      <div class="toggle"></div>
    </div>

    <div class="section-label"><span class="hand">pick your agents</span><span class="section-count">1 selected</span></div>
    <div class="person">
      <div class="av" style="background:#2A2B30;">A</div>
      <div class="p-main"><div class="p-name">Atlas</div><div class="p-sub">data &amp; analysis</div></div>
      <div class="toggle on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#0B0A08" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="person">
      <div class="av" style="background:#35363B;">V</div>
      <div class="p-main"><div class="p-name">Vega</div><div class="p-sub">research &amp; planning</div></div>
      <div class="toggle"></div>
    </div>
    <div class="person">
      <div class="av" style="background:#1E1F23;">S</div>
      <div class="p-main"><div class="p-name">Solace</div><div class="p-sub">tone &amp; wellbeing</div></div>
      <div class="toggle"></div>
    </div>
  </div>

  <div class="dock">
    <div class="btn-create">Create room &middot; 3 selected</div>
  </div>
</div>
</x-dc>
</body>
</html>
